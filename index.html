  let home=d.getElementById('cfHomePage');if(!home){home=d.createElement('div');home.id='cfHomePage';home.className='cf-page';const next=nextTrainingInfo(d),metrics=summaryMetrics(d,trainer);home.innerHTML=`<div class="cf-home-card"><div class="cf-kicker">Järgmine treening</div>${next?`<div class="cf-next-title">${escapeHtml(next.title)}</div><div class="cf-next-meta">${escapeHtml(next.meta)}</div>${next.people?`<div class="cf-next-people">${escapeHtml(next.people)}</div>`:''}`:'<div class="cf-next-title">Hetkel tulevasi treeninguid pole</div><div class="cf-next-meta">Uus treening ilmub siia kohe pärast avaldamist.</div>'}</div><div class="cf-grid">${metrics.map(m=>`<div class="cf-metric"><b>${escapeHtml(m.value)}</b><span>${escapeHtml(m.label)}</span></div>`).join('')}</div><button id="cfHomeAction" class="cf-action" type="button">${trainer?'Lisa treening':'Vaata treeninguid'}</button>`;const hero=content.querySelector('.hero');hero?hero.insertAdjacentElement('afterend',home):content.prepend(home);home.querySelector('#cfHomeAction').addEventListener('click',()=>{switchTab('trainings');setTimeout(()=>{if(trainer)d.getElementById('createCard')?.scrollIntoView({behavior:'smooth',block:'start'})},80)})}

function pushSupported(){return 'serviceWorker'in navigator&&'PushManager'in window&&typeof Notification!=='undefined'}
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function pushRequest(path,opt={}){const session=getSession();if(!session?.access_token||!session?.user?.id)throw new Error('Logi enne CrossFiti sisse.');const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opt,headers});if(!r.ok){const text=await r.text();throw new Error(text||('HTTP '+r.status))}return r}
async function crossfitRegistration(){let reg=await navigator.serviceWorker.getRegistration('/Crossfit/');if(!reg)reg=await navigator.serviceWorker.register('./sw.js?v=3',{scope:'./',updateViaCache:'none'});await reg.update().catch(()=>{});return reg}
async function migrateLegacyPush(){try{const oldReg=await navigator.serviceWorker.getRegistration('/Futbol/wod/'),oldSub=await oldReg?.pushManager?.getSubscription();if(oldSub){await pushRequest('wod_push_subscriptions?endpoint=eq.'+encodeURIComponent(oldSub.endpoint),{method:'DELETE'}).catch(()=>{});await oldSub.unsubscribe().catch(()=>{})}}catch(_){}}
async function storePush(sub){const session=getSession(),json=sub.toJSON();await pushRequest('wod_push_subscriptions?on_conflict=endpoint',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:session.user.id,endpoint:sub.endpoint,p256dh:json.keys?.p256dh||'',auth:json.keys?.auth||'',updated_at:new Date().toISOString()})})}
function setPushUI(d,state,text){const s=d.getElementById('cfPushState'),b=d.getElementById('cfPushButton');if(!s||!b)return;s.textContent=text;s.className='cf-push-state'+(state==='on'?' on':state==='bad'?' bad':'');b.textContent=state==='on'?'Lülita teavitused välja':'Luba teavitused';b.dataset.enabled=state==='on'?'1':'0';b.disabled=pushBusy}
async function refreshPushState(d){if(!d?.getElementById('cfNotificationsPage'))return;if(!pushSupported()){setPushUI(d,'bad','See brauser ei toeta push-teavitusi.');return}if(Notification.permission==='denied'){setPushUI(d,'bad','Teavitused on brauseris blokeeritud.');return}try{const reg=await crossfitRegistration(),sub=await reg.pushManager.getSubscription();setPushUI(d,sub&&Notification.permission==='granted'?'on':'off',sub&&Notification.permission==='granted'?'Teavitused on lubatud':'Teavitused ei ole veel lubatud')}catch(_){setPushUI(d,'off','Teavitused ei ole veel lubatud')}}
async function togglePush(){const inner=getInner(),d=inner?.d;if(!d||pushBusy)return;const enabled=d.getElementById('cfPushButton')?.dataset.enabled==='1';pushBusy=true;try{if(enabled){const reg=await crossfitRegistration(),sub=await reg.pushManager.getSubscription();if(sub){await pushRequest('wod_push_subscriptions?endpoint=eq.'+encodeURIComponent(sub.endpoint),{method:'DELETE'}).catch(()=>{});await sub.unsubscribe()}setPushUI(d,'off','Teavitused on välja lülitatud')}else{const session=getSession();if(!session?.access_token)throw new Error('Logi enne CrossFiti sisse.');if(!pushSupported())throw new Error('See brauser ei toeta push-teavitusi.');const permission=await Notification.requestPermission();if(permission!=='granted')throw new Error(permission==='denied'?'Teavitused on brauseris blokeeritud.':'Teavituste luba ei antud.');await migrateLegacyPush();const reg=await crossfitRegistration();let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)});await storePush(sub);setPushUI(d,'on','Teavitused on lubatud')}}catch(e){setPushUI(d,'bad',e.message||'Teavituste muutmine ebaõnnestus.')}finally{pushBusy=false;const b=d.getElementById('cfPushButton');if(b)b.disabled=false}}
frame.addEventListener('load',()=>{clearInterval(patchTimer);setTimeout(patchApp,500);patchTimer=setInterval(patchApp,900)});
setTimeout(patchApp,800);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=3',{scope:'./',updateViaCache:'none'}).catch(()=>{}));
</script>
