name: RCF paroolitaaste serveri turvakontroll
on:
  push:
    branches: [feat/coach-issued-password-recovery-20261104]
    paths: ['.github/workflows/rcf-recovery-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Kontrolli CORS, autentimist ja sisendi valideerimist ilma kasutajaandmeteta
        shell: bash
        run: |
          set -euo pipefail
          url='https://aanxpugvehwtcwwpefwx.supabase.co/functions/v1/rcf-password-recovery'
          opts=$(curl --silent --show-error --max-time 25 -o /tmp/recovery-options -w '%{http_code}' -X OPTIONS "$url" -H 'Origin: https://karlkirch.github.io' -H 'Access-Control-Request-Method: POST')
          test "$opts" = "204" || { echo "CORS: HTTP $opts"; exit 1; }
          unauth=$(curl --silent --show-error --max-time 25 -o /tmp/recovery-unauth -w '%{http_code}' -X POST "$url" -H 'Origin: https://karlkirch.github.io' -H 'Content-Type: application/json' --data '{"action":"issue","client_id":"00000000-0000-4000-8000-000000000001"}')
          test "$unauth" = "401" || { echo "Trainer auth: HTTP $unauth"; cat /tmp/recovery-unauth; exit 1; }
          invalid=$(curl --silent --show-error --max-time 25 -o /tmp/recovery-invalid -w '%{http_code}' -X POST "$url" -H 'Origin: https://karlkirch.github.io' -H 'Content-Type: application/json' --data '{"action":"redeem","email":"invalid","code":"bad","new_password":"testpassword123"}')
          test "$invalid" = "400" || { echo "Invalid redeem: HTTP $invalid"; cat /tmp/recovery-invalid; exit 1; }
          forbidden=$(curl --silent --show-error --max-time 25 -o /tmp/recovery-forbidden -w '%{http_code}' -X POST "$url" -H 'Origin: https://unknown.example' -H 'Content-Type: application/json' --data '{"action":"issue"}')
          test "$forbidden" = "403" || { echo "Wrong origin: HTTP $forbidden"; exit 1; }
          echo 'Recovery endpoint security checks passed. No user or password was changed.'
